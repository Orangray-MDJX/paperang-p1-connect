[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperang-p1-connect"
version = "0.2.0"
description = "Unofficial Paperang P1 thermal printer service for Windows: USB/Bluetooth printing, durable job queue, LAN IPP server, HTTP API and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Orangray-MDJX" }]
keywords = ["paperang", "thermal-printer", "ipp", "bluetooth", "printing"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "bleak>=0.22",
    "pillow>=10.0",
    "pyusb>=1.2",
    "libusb-package>=1.0",
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pystray>=0.19",
    "pywebview>=6.0",
    "qrcode[pil]>=8.0",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "zeroconf>=0.151.3",
    "winrt-Windows.Devices.Bluetooth>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Rfcomm>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Networking>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Networking.Sockets>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paperang-p1 = "paperang_p1.cli:main"

[tool.setuptools.packages.find]
include = ["paperang_p1*"]

[tool.setuptools.package-data]
paperang_p1 = ["static/*"]
